services:
  - type: web
    name: tracex-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_USE_MOCK
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
