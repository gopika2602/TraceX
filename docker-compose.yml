services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - tracex_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: tracex
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your local .env file}
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      TRACEX_BOOTSTRAP_ADMIN_EMAILS: ${TRACEX_BOOTSTRAP_ADMIN_EMAILS:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_USE_MOCK: "false"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  tracex_mongodb:
