[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attackpath"
version = "0.1.0"
description = "Observed attack path and root cause analysis engine"
requires-python = ">=3.11"
dependencies = ["networkx>=3.2"]

[tool.setuptools]
packages = ["attackpath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
